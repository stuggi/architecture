---
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Shared by the control-plane and edpm-post-ceph stages: both apply an
# OpenStackControlPlane, and the later apply would otherwise remove what the
# earlier one set (client-side apply deletes fields absent from the manifest).

patches:
  - target:
      kind: OpenStackControlPlane
    patch: |-
      apiVersion: core.openstack.org/v1beta1
      kind: OpenStackControlPlane
      metadata:
        name: unused
      spec:
        # Every API service gets a MetalLB LoadBalancer public endpoint on one shared
        # VIP, served on <service>.public.openstack.lab:<director port>. Operator-issued
        # certificates, except placement, which uses a bring-your-own certificate:
        # Bring-your-own certificate for the placement public endpoint, issued
        # by a CA that is trusted through the CA bundle. Both secrets are
        # created before this CR is applied, by the ci-framework hook
        # public_endpoints_byo_cert.yml.
        tls:
          caBundleSecretName: byo-ca-bundle
        placement:
          template:
            tls:
              api:
                public:
                  secretName: placement-public-byo-cert
            override:
              service:
                public:
                  metadata:
                    annotations:
                      metallb.universe.tf/address-pool: ctlplane
                      metallb.universe.tf/allow-shared-ip: public-endpoints
                      metallb.universe.tf/loadBalancerIPs: 192.168.122.85
                  spec:
                    type: LoadBalancer
                  endpointURL: https://placement.public.openstack.lab:13778
        barbican:
          template:
            barbicanAPI:
              override:
                service:
                  public:
                    metadata:
                      annotations:
                        metallb.universe.tf/address-pool: ctlplane
                        metallb.universe.tf/allow-shared-ip: public-endpoints
                        metallb.universe.tf/loadBalancerIPs: 192.168.122.85
                    spec:
                      type: LoadBalancer
                    endpointURL: https://barbican.public.openstack.lab:13311
        cinder:
          template:
            cinderAPI:
              override:
                service:
                  public:
                    metadata:
                      annotations:
                        metallb.universe.tf/address-pool: ctlplane
                        metallb.universe.tf/allow-shared-ip: public-endpoints
                        metallb.universe.tf/loadBalancerIPs: 192.168.122.85
                    spec:
                      type: LoadBalancer
                    endpointURL: https://cinder.public.openstack.lab:13776
        glance:
          template:
            glanceAPIs:
              default:
                override:
                  service:
                    public:
                      metadata:
                        annotations:
                          metallb.universe.tf/address-pool: ctlplane
                          metallb.universe.tf/allow-shared-ip: public-endpoints
                          metallb.universe.tf/loadBalancerIPs: 192.168.122.85
                      spec:
                        type: LoadBalancer
                      endpointURL: https://glance.public.openstack.lab:13292
        keystone:
          template:
            override:
              service:
                public:
                  metadata:
                    annotations:
                      metallb.universe.tf/address-pool: ctlplane
                      metallb.universe.tf/allow-shared-ip: public-endpoints
                      metallb.universe.tf/loadBalancerIPs: 192.168.122.85
                  spec:
                    type: LoadBalancer
                  endpointURL: https://keystone.public.openstack.lab:13000
        neutron:
          template:
            override:
              service:
                public:
                  metadata:
                    annotations:
                      metallb.universe.tf/address-pool: ctlplane
                      metallb.universe.tf/allow-shared-ip: public-endpoints
                      metallb.universe.tf/loadBalancerIPs: 192.168.122.85
                  spec:
                    type: LoadBalancer
                  endpointURL: https://neutron.public.openstack.lab:13696
        nova:
          template:
            cellTemplates:
              cell1:
                # The console proxy has no httpd vhost and terminates TLS itself; the
                # endpoint hostname still lands in its certificate SAN.
                noVNCProxyServiceTemplate:
                  enabled: true
                  override:
                    service:
                      metadata:
                        annotations:
                          metallb.universe.tf/address-pool: ctlplane
                          metallb.universe.tf/allow-shared-ip: public-endpoints
                          metallb.universe.tf/loadBalancerIPs: 192.168.122.85
                      spec:
                        type: LoadBalancer
                      endpointURL: https://novncproxy.public.openstack.lab:13080
            apiServiceTemplate:
              override:
                service:
                  public:
                    metadata:
                      annotations:
                        metallb.universe.tf/address-pool: ctlplane
                        metallb.universe.tf/allow-shared-ip: public-endpoints
                        metallb.universe.tf/loadBalancerIPs: 192.168.122.85
                    spec:
                      type: LoadBalancer
                    endpointURL: https://nova.public.openstack.lab:13774
        horizon:
          template:
            override:
              service:
                metadata:
                  annotations:
                    metallb.universe.tf/address-pool: ctlplane
                    metallb.universe.tf/allow-shared-ip: public-endpoints
                    metallb.universe.tf/loadBalancerIPs: 192.168.122.85
                spec:
                  type: LoadBalancer
                endpointURL: https://horizon.public.openstack.lab
  # Any patch on top of hci/control-plane makes kustomize re-emit the bools set by
  # lib/control-plane/job-settings as the string 'false', which the
  # OpenStackControlPlane webhook rejects. Re-set them with typed values.
  - target:
      kind: OpenStackControlPlane
    patch: |-
      - op: replace
        path: /spec/barbican/template/preserveJobs
        value: false
      - op: replace
        path: /spec/cinder/template/preserveJobs
        value: false
      - op: replace
        path: /spec/designate/template/preserveJobs
        value: false
      - op: replace
        path: /spec/glance/template/preserveJobs
        value: false
      - op: replace
        path: /spec/heat/template/preserveJobs
        value: false
      - op: replace
        path: /spec/horizon/template/preserveJobs
        value: false
      - op: replace
        path: /spec/ironic/template/ironicInspector/preserveJobs
        value: false
      - op: replace
        path: /spec/ironic/template/preserveJobs
        value: false
      - op: replace
        path: /spec/keystone/template/preserveJobs
        value: false
      - op: replace
        path: /spec/manila/template/preserveJobs
        value: false
      - op: replace
        path: /spec/neutron/template/preserveJobs
        value: false
      - op: replace
        path: /spec/nova/template/preserveJobs
        value: false
      - op: replace
        path: /spec/octavia/template/octaviaAPI/preserveJobs
        value: false
      - op: replace
        path: /spec/octavia/template/preserveJobs
        value: false
      - op: replace
        path: /spec/placement/template/preserveJobs
        value: false
      - op: replace
        path: /spec/telemetry/template/autoscaling/aodh/preserveJobs
        value: false
